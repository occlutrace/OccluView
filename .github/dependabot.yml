version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels: ["deps", "cargo"]
    commit-message:
      prefix: "build(deps)"
    groups:
      cargo-patches:
        update-types:
          - "patch"
    ignore:
      - dependency-name: "image"
        # image 0.25.10 raised MSRV to 1.88; OccluView is pinned to 1.86.
        versions: [">=0.25.10"]
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # The fuzz crate is excluded from the workspace, so the entry above does not
  # see it -- while `fuzz-smoke` runs on every push and PR. Without its own
  # lockfile and its own update stream, an unrelated upstream release turns
  # every PR red on a gate that has nothing to do with the change.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["deps", "cargo"]
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["deps", "ci"]
    commit-message:
      prefix: "ci(deps)"

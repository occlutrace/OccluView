version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels: ["deps", "cargo"]
    commit-message:
      prefix: "build(deps)"
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "image"
        # Keep image below 0.25.10: decoder-graph changes require malformed-input,
        # golden-thumbnail, and allocation-bound coverage.
        versions: [">=0.25.10"]

  # The excluded fuzz crate has its own lockfile.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels: ["deps", "cargo"]
    commit-message:
      prefix: "build(deps)"
    groups:
      fuzz-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["deps", "ci"]
    commit-message:
      prefix: "ci(deps)"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_NET_RETRY: 3

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Scheduled security and fuzz runs must finish independently of pushes.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.86.0"
          components: rustfmt
      - name: rustfmt check
        run: cargo fmt --all -- --check
      - name: rustfmt check (fuzz)
        run: cargo fmt --check --manifest-path fuzz/Cargo.toml

  clippy:
    name: clippy (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.86.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  cross-compile:
    name: cross-compile (windows-gnu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.86.0"
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install mingw
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: cargo check (cross-platform crates)
        run: |
          cargo check -p occluview-core -p occluview-formats -p occluview-render \
            --locked --target x86_64-pc-windows-gnu

  windows-only:
    name: build (windows integration)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.86.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check (shell + app)
        run: cargo check -p occluview-shell -p occluview-app --locked

  linux-renderer-tests:
    name: test (linux renderer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.86.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Lavapipe Vulkan adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
          icd=$(find /usr/share/vulkan/icd.d -name '*lvp*.json' -print -quit)
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
          vulkaninfo --summary
      - name: cargo test --workspace
        run: cargo test --workspace --all-targets --locked --no-fail-fast
      - name: cargo test (shipped feature set)
        # Compile the feature set used by release artifacts without a private key.
        run: |
          cargo clippy -p occluview-hps -p occluview-formats \
            --all-features --all-targets --locked -- -D warnings
          cargo test -p occluview-hps -p occluview-formats --all-features --locked

  test:
    name: test (windows shell)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.86.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo test --workspace (without WARP pixel suites)
        run: >
          cargo test --workspace --all-targets --locked --no-fail-fast --
          --skip render_thumb::tests
          --skip preview_scene::

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.86.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo doc (no warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

  deny:
    name: cargo deny (licenses + advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --workspace --all-features

  third-party-notices:
    name: third-party notices (generated file current)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.86.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache cargo-about
        id: cache-cargo-about
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-about
          # Avoid reusing host binaries across runner-image changes.
          key: cargo-about-0.8.4-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}
      - name: Install cargo-about
        if: steps.cache-cargo-about.outputs.cache-hit != 'true'
        # cargo-about 0.8.4 supports the repository MSRV.
        run: cargo install cargo-about --version 0.8.4 --locked
      - name: Regenerate THIRD-PARTY-NOTICES.md
        run: ./scripts/gen-third-party.sh
      - name: Fail on drift
        run: git diff --exit-code -- THIRD-PARTY-NOTICES.md

  linux-package-smoke:
    name: package (linux deb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.86.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream libxml2-utils lintian
      - name: Build the Debian package
        id: deb
        run: |
          set -o pipefail
          package="$(install/linux/build-deb.sh | tail -n 1)"
          echo "path=$package" >> "$GITHUB_OUTPUT"
      - name: Validate desktop and AppStream metadata
        run: |
          desktop-file-validate install/linux/ai.occlutrace.OccluView.desktop
          appstreamcli validate --no-net install/linux/ai.occlutrace.OccluView.metainfo.xml
          xmllint --noout install/linux/occluview-mime.xml \
            install/linux/ai.occlutrace.OccluView.metainfo.xml
      - name: Validate the package contents
        env:
          DEB: ${{ steps.deb.outputs.path }}
        run: |
          dpkg-deb --info "$DEB"
          install/linux/check-deb.sh "$DEB"

  fuzz-smoke:
    name: fuzz smoke (parsers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
      - name: Cache cargo-fuzz
        id: cache-cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          # Avoid reusing host binaries across runner-image changes.
          key: cargo-fuzz-0.12.0-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}
      - name: Install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version 0.12.0 --locked
      # The fuzz crate is excluded from the workspace and has a separate lockfile.
      - name: Check the fuzz lockfile
        run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - name: List fuzz targets
        run: cargo fuzz list
      - name: Restore fuzz corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-smoke-${{ github.run_id }}
          restore-keys: fuzz-corpus-smoke-
      - name: Fuzz dispatch 60s
        run: ./scripts/run-fuzz.sh dispatch 60 65536
      - name: Fuzz HPS parser 60s
        run: ./scripts/run-fuzz.sh hps_parser 60 65536
      - name: Fuzz STL 60s
        run: ./scripts/run-fuzz.sh stl 60 65536
      - name: Fuzz PLY 60s
        run: ./scripts/run-fuzz.sh ply 60 65536
      - name: Fuzz GLB 60s
        run: ./scripts/run-fuzz.sh glb 60 65536

  fuzz-weekly:
    name: fuzz weekly (300s deep)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
      - name: Cache cargo-fuzz
        id: cache-cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.12.0-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}
      - name: Install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version 0.12.0 --locked
      - name: Restore fuzz corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-deep-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-deep-
            fuzz-corpus-smoke-
      - name: Fuzz dispatch 300s
        run: ./scripts/run-fuzz.sh dispatch 300 131072
      - name: Fuzz HPS parser 300s
        run: ./scripts/run-fuzz.sh hps_parser 300 131072
      - name: Fuzz STL 300s
        run: ./scripts/run-fuzz.sh stl 300 131072
      - name: Fuzz PLY 300s
        run: ./scripts/run-fuzz.sh ply 300 131072
      - name: Fuzz GLB 300s
        run: ./scripts/run-fuzz.sh glb 300 131072
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 14

name: Package

on:
  workflow_dispatch:
    inputs:
      windows_configuration:
        description: Build a release package or a private diagnostic MSI.
        type: choice
        options:
          - release
          - diagnostic
        default: release
      include_macos:
        description: Build and publish the notarized macOS package.
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  actions: read

concurrency:
  group: package-${{ github.ref }}-${{ inputs.windows_configuration || 'release' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-release:
    name: resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: release
        name: Resolve package version
        env:
          CONFIGURATION: ${{ inputs.windows_configuration }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$CONFIGURATION" == diagnostic ]]; then
            exit 0
          fi
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Select a vX.Y.Z tag as the workflow ref.' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/$tag" || "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo 'The selected workflow ref must be the requested release tag.' >&2
            exit 1
          fi
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "$tag" != "v$version" ]]; then
            echo 'The release tag does not match the workspace version.' >&2
            exit 1
          fi
          tag_sha=$(git rev-parse --verify "refs/tags/$tag^{commit}")
          source_sha=$(git rev-parse --verify "$GITHUB_SHA^{commit}")
          if [[ "$tag_sha" != "$source_sha" ]]; then
            echo "Release tag $tag resolves to $tag_sha, not workflow source $source_sha." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  windows-package:
    name: build msi
    needs: resolve-release
    if: needs.resolve-release.outputs.tag != '' || (github.event_name == 'workflow_dispatch' && inputs.windows_configuration == 'diagnostic')
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      OCCLUVIEW_SIGN_CERT_SHA1: ${{ secrets.OCCLUVIEW_SIGN_CERT_SHA1 }}
      OCCLUVIEW_SIGN_PFX_PASSWORD: ${{ secrets.OCCLUVIEW_SIGN_PFX_PASSWORD }}
      OCCLUVIEW_SIGN_TIMESTAMP_URL: ${{ vars.OCCLUVIEW_SIGN_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --version 3.14.1 --allow-downgrade --yes --no-progress
      - name: Prepare optional signing certificate
        shell: pwsh
        env:
          OCCLUVIEW_SIGN_PFX_BASE64: ${{ secrets.OCCLUVIEW_SIGN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OCCLUVIEW_SIGN_PFX_BASE64)) {
            Write-Host "No PFX signing certificate configured."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "occluview-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:OCCLUVIEW_SIGN_PFX_BASE64))
          if (-not [string]::IsNullOrWhiteSpace($env:OCCLUVIEW_SIGN_CERT_SHA1)) {
            $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxPath, $env:OCCLUVIEW_SIGN_PFX_PASSWORD)
            $expectedThumbprint = $env:OCCLUVIEW_SIGN_CERT_SHA1.Replace(" ", "").ToUpperInvariant()
            if ($certificate.Thumbprint.Replace(" ", "").ToUpperInvariant() -ne $expectedThumbprint) {
              throw "The configured Windows PFX does not match OCCLUVIEW_SIGN_CERT_SHA1."
            }
          }
          "OCCLUVIEW_SIGN_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify embedded HPS key build path
        shell: pwsh
        env:
          OCCLUVIEW_HPS_EMBEDDED_KEY: ${{ secrets.OCCLUVIEW_HPS_EMBEDDED_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OCCLUVIEW_HPS_EMBEDDED_KEY)) {
            throw "OCCLUVIEW_HPS_EMBEDDED_KEY is required for Package MSI so encrypted HPS files work in the shipped installer."
          }
          git grep --quiet --fixed-strings -e "$env:OCCLUVIEW_HPS_EMBEDDED_KEY" --
          $sourceExit = $LASTEXITCODE
          if ($sourceExit -eq 0) {
            throw "Embedded HPS key material must not appear in tracked source."
          }
          if ($sourceExit -gt 1) {
            throw "Could not scan tracked source for embedded HPS key material."
          }
          # grep's expected no-match status must not escape the pwsh wrapper.
          exit 0
      - name: Build MSI
        shell: pwsh
        env:
          OCCLUVIEW_HPS_EMBEDDED_KEY: ${{ secrets.OCCLUVIEW_HPS_EMBEDDED_KEY }}
          OCCLUVIEW_WINDOWS_CONFIGURATION: ${{ inputs.windows_configuration }}
        run: |
          $configuration = "release"
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:OCCLUVIEW_WINDOWS_CONFIGURATION -eq "diagnostic") {
            $configuration = "diagnostic"
          }
          $buildArgs = @{
            Configuration = $configuration
            SignMode = "auto"
          }
          & ./install/build-msi.ps1 @buildArgs
      - name: Build portable ZIP
        if: inputs.windows_configuration != 'diagnostic'
        shell: pwsh
        run: |
          $cargoText = Get-Content ./Cargo.toml -Raw
          $match = [regex]::Match($cargoText, '(?s)\[workspace\.package\].*?version\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "Could not find workspace package version." }
          $version = $match.Groups[1].Value
          $target = "x86_64-pc-windows-msvc"
          $buildDir = Join-Path $pwd "target\$target\release-unwind"
          $portableRoot = Join-Path $env:RUNNER_TEMP "OccluView"
          $portableDir = Join-Path $portableRoot "OccluView"
          Remove-Item $portableRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item (Join-Path $buildDir "occluview.exe") $portableDir
          Copy-Item (Join-Path $buildDir "occluview_shell.dll") $portableDir
          Copy-Item ./LICENSE $portableDir
          Copy-Item ./NOTICE $portableDir
          Copy-Item ./THIRD-PARTY-NOTICES.md $portableDir
          Copy-Item ./THIRD-PARTY-NOTICES-NATIVE.md $portableDir
          Copy-Item ./README.md $portableDir
          New-Item -ItemType Directory -Path "$portableDir/docs" -Force | Out-Null
          Copy-Item ./docs/measurements.md "$portableDir/docs"
          Compress-Archive -Path $portableDir -DestinationPath "./dist/OccluView-$version-$target-portable.zip" -CompressionLevel Optimal -Force
      - name: Verify Authenticode signatures
        if: inputs.windows_configuration != 'diagnostic'
        shell: pwsh
        run: |
          $pfxPath = $env:OCCLUVIEW_SIGN_PFX_PATH
          $hasPfx = -not [string]::IsNullOrWhiteSpace($pfxPath) -and (Test-Path $pfxPath)
          $hasCert = -not [string]::IsNullOrWhiteSpace($env:OCCLUVIEW_SIGN_CERT_SHA1)
          if (-not $hasPfx -and -not $hasCert) {
            Write-Host "No Authenticode certificate configured; the release artifacts remain unsigned."
            exit 0
          }
          $buildDir = Join-Path $pwd "target/x86_64-pc-windows-msvc/release-unwind"
          $artifacts = @(
            (Join-Path $buildDir "occluview.exe"),
            (Join-Path $buildDir "occluview_shell.dll"),
            (Get-ChildItem ./dist -Filter *.msi | Select-Object -First 1).FullName
          )
          foreach ($path in $artifacts) {
            if (-not (Test-Path $path)) { throw "Expected signed artifact missing: $path" }
            $sig = Get-AuthenticodeSignature -FilePath $path
            if ($sig.Status -ne "Valid") { throw "Authenticode signature for $path is $($sig.Status): $($sig.StatusMessage)" }
            if ($hasCert -and $sig.SignerCertificate.Thumbprint.Replace(" ", "").ToUpperInvariant() -ne $env:OCCLUVIEW_SIGN_CERT_SHA1.Replace(" ", "").ToUpperInvariant()) { throw "Authenticode signer mismatch for $path." }
            Write-Host "Authenticode valid: $path ($($sig.SignerCertificate.Subject))"
          }
      - name: Remove release signing certificate
        if: always()
        shell: pwsh
        run: |
          $pfxPath = $env:OCCLUVIEW_SIGN_PFX_PATH
          if (-not [string]::IsNullOrWhiteSpace($pfxPath) -and (Test-Path $pfxPath)) {
            Remove-Item -LiteralPath $pfxPath -Force
          }
      - name: Record the shipped Explorer shell revision
        if: inputs.windows_configuration != 'diagnostic'
        shell: bash
        run: |
          # The release DLL comes from a pinned revision while the viewer comes
          # from this tree. The pin is a deliberate exception, so the release
          # records it and the delta behind it instead of leaving it to a
          # comment in a build script.
          bash scripts/report-shell-pin.sh dist/occluview-shell-revision.json
      - name: Write Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem ./dist -File | Where-Object { $_.Name -match '\.(msi|zip|json)$' -and $_.Name -ne 'latest.json' } | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 $_.FullName
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - name: Generate SBOM (Windows)
        if: inputs.windows_configuration != 'diagnostic'
        shell: pwsh
        run: |
          cargo install cargo-cyclonedx --version 0.5.8 --locked
          # The virtual workspace emits one SBOM beside each member manifest.
          cargo metadata --locked --format-version 1
          cargo cyclonedx --format json --override-filename sbom-windows
          $sbom = "crates/occluview-app/sbom-windows.json"
          if (-not (Test-Path $sbom)) {
            throw "cargo-cyclonedx produced no SBOM at $sbom."
          }
          $described = (Get-Content $sbom -Raw | ConvertFrom-Json).metadata.component.name
          if ($described -ne "occluview-app") {
            throw "SBOM describes '$described', not the shipped viewer."
          }
          git diff --exit-code -- Cargo.lock
          Move-Item $sbom ./dist/sbom-windows.json -Force
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: occluview-windows-package
          retention-days: 14
          path: |
            dist/*.msi
            dist/*.zip
            dist/*.sha256
            dist/*.json

  linux-package:
    name: build linux deb
    needs: resolve-release
    if: needs.resolve-release.outputs.tag != '' && inputs.windows_configuration != 'diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils libxml2-utils shared-mime-info
      - name: Verify embedded HPS key build path
        env:
          OCCLUVIEW_HPS_EMBEDDED_KEY: ${{ secrets.OCCLUVIEW_HPS_EMBEDDED_KEY }}
        run: |
          if [[ -z "${OCCLUVIEW_HPS_EMBEDDED_KEY:-}" ]]; then
            echo "OCCLUVIEW_HPS_EMBEDDED_KEY is required for Package Linux so encrypted HPS files work in the shipped package." >&2
            exit 1
          fi
          set +e
          git grep --quiet --fixed-strings -e "$OCCLUVIEW_HPS_EMBEDDED_KEY" --
          source_status=$?
          set -e
          if [[ "$source_status" -eq 0 ]]; then
            echo "Embedded HPS key material must not appear in tracked source." >&2
            exit 1
          fi
          if [[ "$source_status" -gt 1 ]]; then
            echo "Could not scan tracked source for embedded HPS key material." >&2
            exit 1
          fi
      - name: Build Debian package
        env:
          OCCLUVIEW_HPS_EMBEDDED_KEY: ${{ secrets.OCCLUVIEW_HPS_EMBEDDED_KEY }}
        run: bash install/linux/build-deb.sh
      - name: Write Linux checksums
        run: |
          for deb in target/deb/*.deb; do
            (cd "$(dirname "$deb")" && sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256")
          done
      - name: Generate SBOM (Linux)
        run: |
          cargo install cargo-cyclonedx --version 0.5.8 --locked
          cargo metadata --locked --format-version 1
          cargo cyclonedx --format json --override-filename sbom-linux
          sbom=crates/occluview-app/sbom-linux.json
          if [[ ! -f "$sbom" ]]; then
            echo "cargo-cyclonedx produced no SBOM at $sbom." >&2
            exit 1
          fi
          python3 - "$sbom" <<'PY'
          import json, sys
          described = json.load(open(sys.argv[1], encoding="utf-8"))["metadata"]["component"]["name"]
          if described != "occluview-app":
              raise SystemExit(f"SBOM describes {described!r}, not the shipped viewer.")
          PY
          git diff --exit-code -- Cargo.lock
          cp "$sbom" target/deb/sbom-linux.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: occluview-linux-package
          retention-days: 14
          path: |
            target/deb/*.deb
            target/deb/*.sha256
            target/deb/*.json

  macos-package:
    name: build macos app
    needs: resolve-release
    if: github.event_name == 'workflow_dispatch' && needs.resolve-release.outputs.tag != '' && inputs.windows_configuration != 'diagnostic' && inputs.include_macos == true
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      notarized: ${{ steps.package.outputs.notarized }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.98.0"
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Require a native Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - name: Verify embedded HPS key build path
        env:
          OCCLUVIEW_HPS_EMBEDDED_KEY: ${{ secrets.OCCLUVIEW_HPS_EMBEDDED_KEY }}
        run: |
          if [[ -z "${OCCLUVIEW_HPS_EMBEDDED_KEY:-}" ]]; then
            echo "OCCLUVIEW_HPS_EMBEDDED_KEY is required for Package macOS so encrypted HPS files work in the shipped app." >&2
            exit 1
          fi
          set +e
          git grep --quiet --fixed-strings -e "$OCCLUVIEW_HPS_EMBEDDED_KEY" --
          source_status=$?
          set -e
          if [[ "$source_status" -eq 0 ]]; then
            echo "Embedded HPS key material must not appear in tracked source." >&2
            exit 1
          fi
          if [[ "$source_status" -gt 1 ]]; then
            echo "Could not scan tracked source for embedded HPS key material." >&2
            exit 1
          fi
      - name: Build the app with the embedded HPS key
        env:
          OCCLUVIEW_HPS_EMBEDDED_KEY: ${{ secrets.OCCLUVIEW_HPS_EMBEDDED_KEY }}
        run: bash install/macos/build-app.sh
      - name: Import Developer ID identities when configured
        id: signing
        env:
          APP_P12: ${{ secrets.OCCLUVIEW_MACOS_APP_P12_BASE64 }}
          INSTALLER_P12: ${{ secrets.OCCLUVIEW_MACOS_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.OCCLUVIEW_MACOS_P12_PASSWORD }}
          APP_IDENTITY: ${{ secrets.OCCLUVIEW_MACOS_APP_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.OCCLUVIEW_MACOS_INSTALLER_IDENTITY }}
          NOTARY_KEY: ${{ secrets.OCCLUVIEW_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.OCCLUVIEW_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.OCCLUVIEW_NOTARY_ISSUER }}
        run: |
          present=0
          for value in "$APP_P12" "$INSTALLER_P12" "$P12_PASSWORD" "$APP_IDENTITY" \
            "$INSTALLER_IDENTITY" "$NOTARY_KEY" "$NOTARY_KEY_ID" "$NOTARY_ISSUER"; do
            [[ -n "$value" ]] && present=$((present + 1))
          done
          if [[ "$present" -eq 0 ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple signing is not configured; the macOS packages are unsigned test builds and will not be published."
            exit 0
          fi
          if [[ "$present" -ne 8 ]]; then
            echo "Apple signing is partly configured ($present of 8 secrets); set all or none." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/occluview-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          for identity in app installer; do
            if [[ "$identity" == app ]]; then p12="$APP_P12"; else p12="$INSTALLER_P12"; fi
            printf '%s' "$p12" | base64 --decode > "$RUNNER_TEMP/$identity.p12"
            security import "$RUNNER_TEMP/$identity.p12" -k "$keychain" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productsign
            rm -f "$RUNNER_TEMP/$identity.p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          umask 077
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Package, and sign and notarize when configured
        id: package
        env:
          OCCLUVIEW_MACOS_APP_IDENTITY: ${{ secrets.OCCLUVIEW_MACOS_APP_IDENTITY }}
          OCCLUVIEW_MACOS_INSTALLER_IDENTITY: ${{ secrets.OCCLUVIEW_MACOS_INSTALLER_IDENTITY }}
          OCCLUVIEW_NOTARY_KEY_ID: ${{ secrets.OCCLUVIEW_NOTARY_KEY_ID }}
          OCCLUVIEW_NOTARY_ISSUER: ${{ secrets.OCCLUVIEW_NOTARY_ISSUER }}
        run: |
          if [[ "${{ steps.signing.outputs.configured }}" == true ]]; then
            OCCLUVIEW_NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8" bash install/macos/sign-and-notarize.sh
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            bash install/macos/build-dmg.sh --no-build
            bash install/macos/build-pkg.sh --no-build
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the packages
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -n1)"
          dmg="target/macos/OccluView-$version-aarch64.dmg"
          pkg="target/macos/OccluView-$version-aarch64.pkg"
          hdiutil verify "$dmg"
          pkgutil --payload-files "$pkg" | grep -F 'OccluView.app/Contents/MacOS/occluview'
          lipo -archs target/macos/OccluView.app/Contents/MacOS/occluview | grep -Fx arm64
          for notice in LICENSE NOTICE THIRD-PARTY-NOTICES.md THIRD-PARTY-NOTICES-NATIVE.md; do
            test -s "target/macos/OccluView.app/Contents/Resources/Legal/$notice"
          done
          (cd target/macos && for file in *.dmg *.pkg; do shasum -a 256 "$file" > "$file.sha256"; done)
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/occluview-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: occluview-macos-package
          retention-days: 14
          path: |
            target/macos/*.dmg
            target/macos/*.pkg
            target/macos/*.sha256

  publish:
    name: publish github release
    if: ${{ always() && needs.resolve-release.result == 'success' && needs.resolve-release.outputs.tag != '' && inputs.windows_configuration != 'diagnostic' && needs.windows-package.result == 'success' && needs.linux-package.result == 'success' && (needs.macos-package.result == 'success' || needs.macos-package.result == 'skipped') }}
    timeout-minutes: 20
    needs:
      - resolve-release
      - windows-package
      - linux-package
      - macos-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
      RELEASE_SOURCE_SHA: ${{ needs.resolve-release.outputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
      # Only a signed, notarized macOS build is published or offered to the
      # updater; an unsigned one is a workflow artifact for testing.
      MACOS_NOTARIZED: ${{ needs.macos-package.outputs.notarized }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Write release notes
        run: |
          {
            printf '# OccluView %s\n\n' "$RELEASE_TAG"
            printf '%s\n\n' 'A native desktop viewer for dental 3D scans.'
            printf 'Source SHA: [%s](%s/%s/commit/%s)\n\n' "$RELEASE_SOURCE_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_SOURCE_SHA"
            printf '%s\n' '## Downloads'
            printf '%s\n' '- **OccluView-Windows-Setup.msi** — installs the viewer and Explorer integration.'
            printf '%s\n' '- **OccluView-Windows-Portable.zip** — runs without installation.'
            printf '%s\n' '- **OccluView-Linux.deb** — Debian and Ubuntu package.'
            if [[ "$MACOS_NOTARIZED" == true ]]; then
              printf '%s\n' '- **OccluView-macOS-AppleSilicon.dmg** — signed, notarized application image.'
              printf '%s\n' '- **OccluView-macOS-AppleSilicon.pkg** — signed, notarized installer.'
            fi
          } > dist/release-notes.md
      - name: Sign update artifacts and write latest.json
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [[ -z "$MINISIGN_SECRET_KEY" ]]; then
            echo "MINISIGN_SECRET_KEY secret is not configured." >&2
            exit 1
          fi
          sudo apt-get update -q && sudo apt-get install -qy minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          trap 'rm -f /tmp/minisign.key' EXIT

          tag="$RELEASE_TAG"
          version="${tag#v}"
          msi=$(find ./dist -type f -name '*.msi' | head -n1)
          zip=$(find ./dist -type f -name '*.zip' | head -n1)
          deb=$(find ./dist -type f -name '*.deb' | head -n1)
          if [[ -z "$msi" || -z "$zip" || -z "$deb" ]]; then
            echo "Missing release artifact (msi='$msi' zip='$zip' deb='$deb')." >&2
            exit 1
          fi

          rename_release_asset() {
            local source="$1"
            local destination="$2"
            mv "$source" "$destination"
            rm -f "$source.sha256"
            (
              cd ./dist
              sha256sum "$(basename "$destination")" > "$(basename "$destination").sha256"
            )
          }
          rename_release_asset "$msi" "./dist/OccluView-Windows-Setup.msi"
          rename_release_asset "$zip" "./dist/OccluView-Windows-Portable.zip"
          rename_release_asset "$deb" "./dist/OccluView-Linux.deb"
          msi="./dist/OccluView-Windows-Setup.msi"
          zip="./dist/OccluView-Windows-Portable.zip"
          deb="./dist/OccluView-Linux.deb"

          sign_and_hash() {
            local file="$1"
            minisign -S -s /tmp/minisign.key -m "$file"
            sha256sum "$file" | cut -d' ' -f1
          }
          msi_sha=$(sign_and_hash "$msi")
          msi_name=$(basename "$msi")
          zip_sha=$(sign_and_hash "$zip")
          zip_name=$(basename "$zip")
          deb_sha=$(sign_and_hash "$deb")
          deb_name=$(basename "$deb")
          echo "Signed portable ZIP $zip_name ($zip_sha)"

          dmg=$(find ./dist -maxdepth 1 -type f -name '*.dmg' | head -n1)
          pkg=$(find ./dist -maxdepth 1 -type f -name '*.pkg' | head -n1)
          pkg_name=""
          pkg_sha=""
          pkg_sig=""
          if [[ "$MACOS_NOTARIZED" == true ]]; then
            if [[ -z "$dmg" || -z "$pkg" ]]; then
              echo "Missing notarized macOS artifact (dmg='$dmg' pkg='$pkg')." >&2
              exit 1
            fi
            rename_release_asset "$dmg" "./dist/OccluView-macOS-AppleSilicon.dmg"
            rename_release_asset "$pkg" "./dist/OccluView-macOS-AppleSilicon.pkg"
            sign_and_hash "./dist/OccluView-macOS-AppleSilicon.dmg" >/dev/null
            pkg="./dist/OccluView-macOS-AppleSilicon.pkg"
            pkg_sha=$(sign_and_hash "$pkg")
            pkg_name=$(basename "$pkg")
            pkg_sig="$pkg.minisig"
          else
            # Gatekeeper refuses an unsigned download, and the updater must not
            # offer one; the unsigned packages stay in the workflow artifacts.
            find ./dist -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.pkg' \
              -o -name '*.dmg.sha256' -o -name '*.pkg.sha256' \) -delete
            echo "::warning::The macOS packages are not notarized and are left out of the release."
          fi

          python3 scripts/write-latest-json.py "$version" "$tag" \
            "$msi_name" "$msi_sha" "$msi.minisig" \
            "$deb_name" "$deb_sha" "$deb.minisig" \
            "$pkg_name" "$pkg_sha" "$pkg_sig"
          minisign -S -s /tmp/minisign.key -m dist/latest.json
          echo "Update manifest:" && cat dist/latest.json
      - name: Verify the signatures against the key the updater ships
        run: |
          # Verify with the public key compiled into installed copies.
          pubkey=$(sed -n 's/^pub const UPDATE_PUBKEY: &str = "\(.*\)";$/\1/p' \
            crates/occluview-update/src/lib.rs)
          if [[ -z "$pubkey" ]]; then
            echo "Could not read UPDATE_PUBKEY from crates/occluview-update/src/lib.rs." >&2
            exit 1
          fi
          for file in dist/latest.json $(find ./dist -type f -name '*.minisig' -not -name 'latest.json.minisig' | sed 's/\.minisig$//'); do
            minisign -V -P "$pubkey" -m "$file"
            echo "Verified against the shipped public key: $file"
          done
      - name: Bundle verification material
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          version="${RELEASE_TAG#v}"
          cp ./occluview.pub ./dist/occluview.pub
          (
            cd ./dist
            shopt -s nullglob
            material=( *.sha256 *.minisig latest.json sbom-*.json occluview.pub )
            if [[ "${#material[@]}" -eq 0 ]]; then
              echo "No verification material was produced." >&2
              exit 1
            fi
            zip -q "OccluView-${version}-verification.zip" "${material[@]}"
            sha256sum "OccluView-${version}-verification.zip" > "OccluView-${version}-verification.zip.sha256"
          )
          if [[ -z "$MINISIGN_SECRET_KEY" ]]; then
            echo "MINISIGN_SECRET_KEY secret is not configured." >&2
            exit 1
          fi
          umask 077
          signing_key=$(mktemp)
          trap 'rm -f "$signing_key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$signing_key"
          bundle="./dist/OccluView-${version}-verification.zip"
          minisign -S -s "$signing_key" -m "$bundle"
          pubkey=$(sed -n 's/^pub const UPDATE_PUBKEY: &str = "\(.*\)";$/\1/p' \
            crates/occluview-update/src/lib.rs)
          if [[ -z "$pubkey" ]]; then
            echo "Could not read the shipped update public key." >&2
            exit 1
          fi
          minisign -V -P "$pubkey" -m "$bundle"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # One explicit pattern per artifact: the action splits this list on
          # commas and globs with brace expansion disabled, so a compact
          # dist/*.{msi,zip,deb} matches nothing at all. The SBOM pattern is
          # deliberately narrower than dist/*.json, which would also sweep
          # latest.json, whose provenance is the minisign signature.
          subject-path: |
            dist/*.msi
            dist/*.zip
            dist/*.deb
            dist/sbom-*.json
            dist/occluview-shell-revision.json
      - name: Attest macOS build provenance
        if: ${{ env.MACOS_NOTARIZED == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.pkg
      - name: Publish GitHub Release
        run: |
          tag="$RELEASE_TAG"
          source_sha="$RELEASE_SOURCE_SHA"
          source_link="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${source_sha})"
          mapfile -d '' assets < <(find ./dist -maxdepth 1 -type f \( -name 'OccluView-Windows-Setup.msi' -o -name 'OccluView-Windows-Portable.zip' -o -name 'OccluView-Linux.deb' -o -name 'OccluView-macOS-AppleSilicon.dmg' -o -name 'OccluView-macOS-AppleSilicon.pkg' -o -name '*-verification.zip' -o -name 'latest.json' -o -name '*.minisig' -o -name '*.sha256' \) -print0 | sort -z)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets found." >&2
            exit 1
          fi

          remote_tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          if [[ "$remote_tag_sha" != "$source_sha" ]]; then
            echo "Remote tag $tag resolves to $remote_tag_sha, not source $source_sha." >&2
            exit 1
          fi

          release_json=""
          if release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null); then
            if ! jq -e --arg source_link "$source_link" \
              '(.draft == true) and ((.body // "") | contains($source_link))' \
              <<< "$release_json" >/dev/null; then
              echo "An existing release for $tag is published or belongs to a different source; refusing to change it." >&2
              exit 1
            fi
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "OccluView $tag" --notes-file "./dist/release-notes.md"
            release_id=$(jq -r .id <<< "$release_json")
            mapfile -t old_asset_ids < <(
              gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[].id'
            )
            for asset_id in "${old_asset_ids[@]}"; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "${assets[@]}"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$source_sha" "${assets[@]}" --title "OccluView $tag" --notes-file "./dist/release-notes.md" --draft
          fi

          verify_dir=$(mktemp -d "$RUNNER_TEMP/occluview-release-assets.XXXXXX")
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$verify_dir"
          mapfile -d '' downloaded < <(find "$verify_dir" -maxdepth 1 -type f -print0 | sort -z)
          if [[ "${#downloaded[@]}" -ne "${#assets[@]}" ]]; then
            echo "Release asset count mismatch: expected ${#assets[@]}, downloaded ${#downloaded[@]}." >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            name=$(basename "$asset")
            downloaded_asset="$verify_dir/$name"
            if [[ ! -f "$downloaded_asset" ]]; then
              echo "Release asset is missing after download: $name." >&2
              exit 1
            fi
            expected_sha=$(sha256sum "$asset" | cut -d' ' -f1)
            actual_sha=$(sha256sum "$downloaded_asset" | cut -d' ' -f1)
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "Release asset digest mismatch: $name." >&2
              exit 1
            fi
          done

          remote_tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          if [[ "$remote_tag_sha" != "$source_sha" ]]; then
            echo "Remote tag $tag changed during package publication." >&2
            exit 1
          fi
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          if ! jq -e --arg source_link "$source_link" \
            '(.draft == true) and ((.body // "") | contains($source_link))' \
            <<< "$release_json" >/dev/null; then
            echo "Release draft changed during asset verification; refusing to publish." >&2
            exit 1
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest

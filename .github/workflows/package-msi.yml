name: Package

on:
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: >-
          Run the tag-only release path (signature verification, minisign,
          latest.json, release notes) without creating a GitHub Release.
        type: boolean
        default: false
      windows_configuration:
        description: >-
          Windows package profile. Diagnostic is a non-release,
          symbol-carrying MSI and never enters the release path.
        type: choice
        options:
          - release
          - diagnostic
        default: release
      legacy_msi_run_id:
        description: >-
          Optional Actions run ID containing one known legacy MSI to exercise
          a checksum-pinned migration before package verification.
        type: string
        default: ""
      legacy_msi_sha256:
        description: >-
          Required SHA-256 for legacy_msi_run_id's MSI; leave blank unless the
          run ID is also supplied.
        type: string
        default: ""
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  actions: read

concurrency:
  # A non-release diagnostic run must not cancel an ordinary package
  # verification for the same commit. Tag and normal manual runs still share
  # the release lane.
  group: package-${{ github.ref }}-${{ inputs.windows_configuration || 'release' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-package:
    name: build msi
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      OCCLUVIEW_SIGN_CERT_SHA1: ${{ secrets.OCCLUVIEW_SIGN_CERT_SHA1 }}
      OCCLUVIEW_SIGN_PFX_PASSWORD: ${{ secrets.OCCLUVIEW_SIGN_PFX_PASSWORD }}
      OCCLUVIEW_SIGN_TIMESTAMP_URL: ${{ vars.OCCLUVIEW_SIGN_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $cargoText = Get-Content ./Cargo.toml -Raw
          $match = [regex]::Match($cargoText, '(?s)\[workspace\.package\].*?version\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "Could not find workspace package version." }
          $expectedTag = "v$($match.Groups[1].Value)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match Cargo version '$expectedTag'."
          }
      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --version 3.14.1 --allow-downgrade --yes --no-progress
      - name: Prepare signing certificate
        shell: pwsh
        env:
          OCCLUVIEW_SIGN_PFX_BASE64: ${{ secrets.OCCLUVIEW_SIGN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OCCLUVIEW_SIGN_PFX_BASE64)) {
            Write-Host "No PFX signing certificate configured."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "occluview-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:OCCLUVIEW_SIGN_PFX_BASE64))
          "OCCLUVIEW_SIGN_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify embedded HPS key build path
        shell: pwsh
        env:
          OCCLUVIEW_HPS_EMBEDDED_KEY: ${{ secrets.OCCLUVIEW_HPS_EMBEDDED_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OCCLUVIEW_HPS_EMBEDDED_KEY)) {
            throw "OCCLUVIEW_HPS_EMBEDDED_KEY is required for Package MSI so encrypted HPS files work in the shipped installer."
          }
          git grep --quiet --fixed-strings -e "$env:OCCLUVIEW_HPS_EMBEDDED_KEY" --
          $sourceExit = $LASTEXITCODE
          if ($sourceExit -eq 0) {
            throw "Embedded HPS key material must not appear in tracked source."
          }
          if ($sourceExit -gt 1) {
            throw "Could not scan tracked source for embedded HPS key material."
          }

          $testLog = Join-Path $env:RUNNER_TEMP "occluview-hps-provider-test.log"
          cargo test --locked -p occluview-hps --features private-hps-key key::tests::runtime_provider_reads_generated_embedded_key_when_present -- --nocapture *> $testLog
          $testExit = $LASTEXITCODE
          if (Select-String -Path $testLog -SimpleMatch -Pattern $env:OCCLUVIEW_HPS_EMBEDDED_KEY -Quiet) {
            Remove-Item -LiteralPath $testLog -Force
            throw "Embedded HPS key material appeared in provider test logs."
          }
          Get-Content -LiteralPath $testLog
          Remove-Item -LiteralPath $testLog -Force
          if ($testExit -ne 0) {
            throw "Leaf HPS runtime-provider test failed with exit code $testExit."
          }
      - name: Build MSI
        shell: pwsh
        env:
          OCCLUVIEW_HPS_EMBEDDED_KEY: ${{ secrets.OCCLUVIEW_HPS_EMBEDDED_KEY }}
        run: |
          $configuration = "release"
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and "${{ inputs.windows_configuration }}" -eq "diagnostic") {
            $configuration = "diagnostic"
          }
          ./install/build-msi.ps1 -Configuration $configuration -SignMode auto
      - name: Build portable ZIP
        if: inputs.windows_configuration != 'diagnostic'
        shell: pwsh
        run: |
          $cargoText = Get-Content ./Cargo.toml -Raw
          $match = [regex]::Match($cargoText, '(?s)\[workspace\.package\].*?version\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "Could not find workspace package version." }
          $version = $match.Groups[1].Value
          $target = "x86_64-pc-windows-msvc"
          $buildDir = Join-Path $pwd "target\$target\release"
          $portableRoot = Join-Path $env:RUNNER_TEMP "OccluView"
          $portableDir = Join-Path $portableRoot "OccluView"
          Remove-Item $portableRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item (Join-Path $buildDir "occluview.exe") $portableDir
          Copy-Item (Join-Path $buildDir "occluview_shell.dll") $portableDir
          Copy-Item ./LICENSE $portableDir
          Copy-Item ./NOTICE $portableDir
          Copy-Item ./THIRD-PARTY-NOTICES.md $portableDir
          Copy-Item ./THIRD-PARTY-NOTICES-NATIVE.md $portableDir
          Copy-Item ./README.md $portableDir
          Compress-Archive -Path $portableDir -DestinationPath "./dist/OccluView-$version-$target-portable.zip" -CompressionLevel Optimal -Force
      - name: Verify Authenticode signatures when configured
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.release_dry_run) && inputs.windows_configuration != 'diagnostic'
        shell: pwsh
        run: |
          $pfxPath = $env:OCCLUVIEW_SIGN_PFX_PATH
          $hasPfx = -not [string]::IsNullOrWhiteSpace($pfxPath) -and (Test-Path $pfxPath)
          $hasCert = -not [string]::IsNullOrWhiteSpace($env:OCCLUVIEW_SIGN_CERT_SHA1)
          if (-not $hasPfx -and -not $hasCert) {
            Write-Host "No Authenticode certificate configured; skipping optional signature verification."
            exit 0
          }
          $buildDir = Join-Path $pwd "target/x86_64-pc-windows-msvc/release"
          $artifacts = @(
            (Join-Path $buildDir "occluview.exe"),
            (Join-Path $buildDir "occluview_shell.dll"),
            (Get-ChildItem ./dist -Filter *.msi | Select-Object -First 1).FullName
          )
          foreach ($path in $artifacts) {
            if (-not (Test-Path $path)) { throw "Expected signed artifact missing: $path" }
            $sig = Get-AuthenticodeSignature -FilePath $path
            if ($sig.Status -ne "Valid") { throw "Authenticode signature for $path is $($sig.Status): $($sig.StatusMessage)" }
            Write-Host "Authenticode valid: $path ($($sig.SignerCertificate.Subject))"
          }
      - name: Build upgrade smoke MSIs
        if: inputs.windows_configuration != 'diagnostic'
        shell: pwsh
        env:
          OCCLUVIEW_SIGN_CERT_SHA1: ${{ secrets.OCCLUVIEW_SIGN_CERT_SHA1 }}
          OCCLUVIEW_SIGN_PFX_PASSWORD: ${{ secrets.OCCLUVIEW_SIGN_PFX_PASSWORD }}
        run: |
          $cargoText = Get-Content ./Cargo.toml -Raw
          $match = [regex]::Match($cargoText, '(?s)\[workspace\.package\].*?version\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "Could not find workspace package version." }
          $version = [version]$match.Groups[1].Value
          $upgradeVersion = "{0}.{1}.{2}" -f $version.Major, $version.Minor, ($version.Build + 1)
          $smokeDir = Join-Path $env:RUNNER_TEMP "occluview-msi-upgrade"
          ./install/build-msi.ps1 -Version $upgradeVersion -OutputDir $smokeDir -SkipBuild -SignMode auto
      - name: Validate optional legacy MSI migration inputs
        if: inputs.windows_configuration != 'diagnostic'
        shell: pwsh
        env:
          OCCLUVIEW_LEGACY_MSI_RUN_ID: ${{ inputs.legacy_msi_run_id }}
          OCCLUVIEW_LEGACY_MSI_SHA256: ${{ inputs.legacy_msi_sha256 }}
        run: |
          $runId = $env:OCCLUVIEW_LEGACY_MSI_RUN_ID.Trim()
          $sha256 = $env:OCCLUVIEW_LEGACY_MSI_SHA256.Trim()
          if ([string]::IsNullOrWhiteSpace($runId) -xor [string]::IsNullOrWhiteSpace($sha256)) {
            throw "Legacy MSI migration inputs must be supplied together."
          }
      - name: Download optional legacy MSI migration artifact
        if: inputs.windows_configuration != 'diagnostic' && inputs.legacy_msi_run_id != '' && inputs.legacy_msi_sha256 != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: occluview-windows-package
          path: ${{ runner.temp }}/occluview-legacy-migration
          repository: ${{ github.repository }}
          run-id: ${{ inputs.legacy_msi_run_id }}
          github-token: ${{ github.token }}
      - name: Verify optional legacy MSI migration artifact
        if: inputs.windows_configuration != 'diagnostic' && inputs.legacy_msi_run_id != '' && inputs.legacy_msi_sha256 != ''
        shell: pwsh
        env:
          OCCLUVIEW_LEGACY_MSI_RUN_ID: ${{ inputs.legacy_msi_run_id }}
          OCCLUVIEW_LEGACY_MSI_SHA256: ${{ inputs.legacy_msi_sha256 }}
        run: |
          $legacyRoot = Join-Path $env:RUNNER_TEMP "occluview-legacy-migration"
          $runId = $env:OCCLUVIEW_LEGACY_MSI_RUN_ID.Trim()
          $legacyMsis = @(Get-ChildItem -Path $legacyRoot -Filter *.msi -File -Recurse)
          if ($legacyMsis.Count -ne 1) {
            throw "Expected exactly one legacy MSI from run $runId, found $($legacyMsis.Count)."
          }
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $legacyMsis[0].FullName).Hash.ToLowerInvariant()
          $expectedSha256 = $env:OCCLUVIEW_LEGACY_MSI_SHA256.Trim().ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Legacy MSI SHA-256 mismatch: expected $expectedSha256, got $actualSha256."
          }
          "OCCLUVIEW_LEGACY_MSI_PATH=$($legacyMsis[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Smoke install and uninstall
        if: inputs.windows_configuration != 'diagnostic'
        shell: pwsh
        run: |
          $releaseMsi = Get-ChildItem ./dist -Filter *.msi | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $upgradeMsi = Get-ChildItem (Join-Path $env:RUNNER_TEMP "occluview-msi-upgrade") -Filter *.msi | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not [string]::IsNullOrWhiteSpace($env:OCCLUVIEW_LEGACY_MSI_PATH)) {
            ./install/test-msi-lifecycle.ps1 -MsiPath $releaseMsi.FullName -LegacyUpgradeMsiPath $env:OCCLUVIEW_LEGACY_MSI_PATH -UpgradeMsiPath $upgradeMsi.FullName -DowngradeMsiPath $releaseMsi.FullName
          } else {
            ./install/test-msi-lifecycle.ps1 -MsiPath $releaseMsi.FullName -UpgradeMsiPath $upgradeMsi.FullName -DowngradeMsiPath $releaseMsi.FullName
          }
      - name: Diagnostic MSI lifecycle smoke
        if: inputs.windows_configuration == 'diagnostic'
        shell: pwsh
        run: |
          $diagnosticMsi = Get-ChildItem ./dist -Filter "*-diagnostic.msi" -File | Select-Object -First 1
          if ($null -eq $diagnosticMsi) { throw "Diagnostic MSI artifact missing." }
          ./install/test-msi-lifecycle.ps1 -MsiPath $diagnosticMsi.FullName -Diagnostic
      - name: Write Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem ./dist -File | Where-Object { $_.Name -match '\.(msi|zip)$' } | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 $_.FullName
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - name: Generate SBOM (Windows)
        shell: pwsh
        run: |
          cargo install cargo-cyclonedx --version 0.5.8 --locked
          # The virtual workspace emits one SBOM beside each member manifest.
          cargo metadata --locked --format-version 1
          cargo cyclonedx --format json --override-filename sbom-windows
          $sbom = "crates/occluview-app/sbom-windows.json"
          if (-not (Test-Path $sbom)) {
            throw "cargo-cyclonedx produced no SBOM at $sbom."
          }
          $described = (Get-Content $sbom -Raw | ConvertFrom-Json).metadata.component.name
          if ($described -ne "occluview-app") {
            throw "SBOM describes '$described', not the shipped viewer."
          }
          git diff --exit-code -- Cargo.lock
          Move-Item $sbom ./dist/sbom-windows.json -Force
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: occluview-windows-package
          retention-days: 14
          path: |
            dist/*.msi
            dist/*.zip
            dist/*.sha256
            dist/*.json

  linux-package:
    name: build linux deb
    if: inputs.windows_configuration != 'diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(awk '
            $0 == "[workspace.package]" { in_section = 1; next }
            /^\[/ && in_section { exit }
            in_section && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"
          test -n "$version"
          expected_tag="v$version"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match Cargo version '$expected_tag'." >&2
            exit 1
          fi
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils libxml2-utils shared-mime-info lintian
      - name: Verify embedded HPS key build path
        env:
          OCCLUVIEW_HPS_EMBEDDED_KEY: ${{ secrets.OCCLUVIEW_HPS_EMBEDDED_KEY }}
        run: |
          if [[ -z "${OCCLUVIEW_HPS_EMBEDDED_KEY:-}" ]]; then
            echo "OCCLUVIEW_HPS_EMBEDDED_KEY is required for Package Linux so encrypted HPS files work in the shipped package." >&2
            exit 1
          fi
          set +e
          git grep --quiet --fixed-strings -e "$OCCLUVIEW_HPS_EMBEDDED_KEY" --
          source_status=$?
          set -e
          if [[ "$source_status" -eq 0 ]]; then
            echo "Embedded HPS key material must not appear in tracked source." >&2
            exit 1
          fi
          if [[ "$source_status" -gt 1 ]]; then
            echo "Could not scan tracked source for embedded HPS key material." >&2
            exit 1
          fi

          test_log="$(mktemp)"
          set +e
          cargo test --locked -p occluview-hps --features private-hps-key key::tests::runtime_provider_reads_generated_embedded_key_when_present -- --nocapture >"$test_log" 2>&1
          test_status=$?
          set -e
          if printf '%s\n' "$OCCLUVIEW_HPS_EMBEDDED_KEY" | grep -Fq -f - "$test_log"; then
            rm -f "$test_log"
            echo "Embedded HPS key material appeared in provider test logs." >&2
            exit 1
          fi
          cat "$test_log"
          rm -f "$test_log"
          if [[ "$test_status" -ne 0 ]]; then
            echo "Leaf HPS runtime-provider test failed with exit code $test_status." >&2
            exit "$test_status"
          fi
      - name: Build Debian package
        id: deb
        env:
          OCCLUVIEW_HPS_EMBEDDED_KEY: ${{ secrets.OCCLUVIEW_HPS_EMBEDDED_KEY }}
        run: |
          set -o pipefail
          package="$(install/linux/build-deb.sh | tail -n 1)"
          echo "path=$package" >> "$GITHUB_OUTPUT"
      - name: Validate Debian package
        env:
          DEB: ${{ steps.deb.outputs.path }}
        run: |
          desktop-file-validate install/linux/ai.occlutrace.OccluView.desktop
          appstreamcli validate --no-net install/linux/ai.occlutrace.OccluView.metainfo.xml
          xmllint --noout install/linux/occluview-mime.xml install/linux/ai.occlutrace.OccluView.metainfo.xml
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          install/linux/check-deb.sh "$DEB"
      - name: Write Linux checksums
        run: |
          for deb in target/deb/*.deb; do
            (cd "$(dirname "$deb")" && sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256")
          done
      - name: Generate SBOM (Linux)
        run: |
          cargo install cargo-cyclonedx --version 0.5.8 --locked
          cargo metadata --locked --format-version 1
          cargo cyclonedx --format json --override-filename sbom-linux
          sbom=crates/occluview-app/sbom-linux.json
          if [[ ! -f "$sbom" ]]; then
            echo "cargo-cyclonedx produced no SBOM at $sbom." >&2
            exit 1
          fi
          python3 - "$sbom" <<'PY'
          import json, sys
          described = json.load(open(sys.argv[1], encoding="utf-8"))["metadata"]["component"]["name"]
          if described != "occluview-app":
              raise SystemExit(f"SBOM describes {described!r}, not the shipped viewer.")
          PY
          git diff --exit-code -- Cargo.lock
          cp "$sbom" target/deb/sbom-linux.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: occluview-linux-package
          retention-days: 14
          path: |
            target/deb/*.deb
            target/deb/*.sha256
            target/deb/*.json

  publish:
    name: publish github release
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.release_dry_run) && inputs.windows_configuration != 'diagnostic'
    timeout-minutes: 20
    needs:
      - windows-package
      - linux-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Resolve release tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            # Dry run: no tag exists, so take the version the packages were
            # actually built from. Everything downstream then behaves exactly
            # as it will on the real tag.
            version=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
              | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -n1)
            if [[ -z "$version" ]]; then
              echo "Could not read the workspace version from Cargo.toml." >&2
              exit 1
            fi
            tag="v$version"
            echo "Dry run: using $tag from Cargo.toml."
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Write release notes
        run: |
          cat > dist/release-notes.md <<NOTES
          OccluView $RELEASE_TAG

          ## Start here

          ### Windows installer — recommended

          Download \`OccluView-Windows-Setup.msi\`. It installs the
          viewer, Explorer thumbnails, the live Preview Pane, and file
          associations. For a normal Windows workstation, this is the only file
          to choose.

          ### Windows portable (.zip)

          Use \`OccluView-Windows-Portable.zip\` only when software cannot be
          installed. It opens OccluView manually and does not add Explorer
          previews or file associations.

          ### Debian / Ubuntu (.deb)

          Download \`OccluView-Linux.deb\` for the native Linux viewer,
          launcher, MIME registration, and thumbnailer.

          <details>
          <summary>For IT and verification</summary>

          The \`OccluView-${RELEASE_TAG#v}-verification.zip\` download contains
          checksums, signature material, the signed update manifest, public key,
          and SBOMs for verification and audit. GitHub build provenance remains
          attached to each normal package. Normal users do not need this archive.

          All packages install LICENSE, NOTICE, THIRD-PARTY-NOTICES.md and
          THIRD-PARTY-NOTICES-NATIVE.md (the statically linked C++ components,
          which no Cargo-derived document covers).

          Extract the verification archive beside the package, then verify if
          your clinic IT team requires it:

          \`\`\`
          sha256sum -c <asset>.sha256
          minisign -Vm <asset> -P RWRoIIL40qxwrFOI5OeCx0Fcf1ClUksy36PrIZrdKkGhQq2kFOtITQnq
          gh attestation verify <asset> --repo occlutrace/OccluView
          \`\`\`

          The same key is published as occluview.pub in the repository and is
          compiled into the updater. sbom-windows.json and sbom-linux.json list
          every third-party component in the binaries.

          </details>
          NOTES
          # The changelog section for this version, verbatim, so the release
          # page states what changed without a second hop.
          version="${RELEASE_TAG#v}"
          changes=$(awk -v ver="$version" '$0 ~ "^## "ver" " {flag=1; next} /^## /{flag=0} flag' CHANGELOG.md)
          if [[ -z "${changes// /}" ]]; then
            echo "CHANGELOG.md has no '## $version' section; the release page would say nothing." >&2
            exit 1
          fi
          {
            echo
            echo "Changes:"
            printf '%s\n' "$changes"
          } >> dist/release-notes.md
      - name: Sign update artifacts and write latest.json
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [[ -z "$MINISIGN_SECRET_KEY" ]]; then
            echo "MINISIGN_SECRET_KEY secret is not configured." >&2
            exit 1
          fi
          sudo apt-get update -q && sudo apt-get install -qy minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key

          tag="$RELEASE_TAG"
          version="${tag#v}"
          msi=$(find ./dist -type f -name '*.msi' | head -n1)
          zip=$(find ./dist -type f -name '*.zip' | head -n1)
          deb=$(find ./dist -type f -name '*.deb' | head -n1)
          if [[ -z "$msi" || -z "$zip" || -z "$deb" ]]; then
            echo "Missing release artifact (msi='$msi' zip='$zip' deb='$deb')." >&2
            exit 1
          fi

          rename_release_asset() {
            local source="$1"
            local destination="$2"
            mv "$source" "$destination"
            rm -f "$source.sha256"
            (
              cd ./dist
              sha256sum "$(basename "$destination")" > "$(basename "$destination").sha256"
            )
          }
          rename_release_asset "$msi" "./dist/OccluView-Windows-Setup.msi"
          rename_release_asset "$zip" "./dist/OccluView-Windows-Portable.zip"
          rename_release_asset "$deb" "./dist/OccluView-Linux.deb"
          msi="./dist/OccluView-Windows-Setup.msi"
          zip="./dist/OccluView-Windows-Portable.zip"
          deb="./dist/OccluView-Linux.deb"

          sign_and_hash() {
            local file="$1"
            minisign -S -s /tmp/minisign.key -m "$file"
            sha256sum "$file" | cut -d' ' -f1
          }
          msi_sha=$(sign_and_hash "$msi")
          msi_name=$(basename "$msi")
          zip_sha=$(sign_and_hash "$zip")
          zip_name=$(basename "$zip")
          deb_sha=$(sign_and_hash "$deb")
          deb_name=$(basename "$deb")
          echo "Signed portable ZIP $zip_name ($zip_sha)"

          python3 - "$version" "$tag" \
            "$msi_name" "$msi_sha" "$msi.minisig" \
            "$deb_name" "$deb_sha" "$deb.minisig" <<'PY'
          import json, sys
          version, tag, msi_name, msi_sha, msi_sig, deb_name, deb_sha, deb_sig = sys.argv[1:9]
          release_url = f"https://github.com/occlutrace/OccluView/releases/download/{tag}"
          manifest = {
              "version": version,
              "notes": f"OccluView {tag} — see the GitHub release for details.",
              "platforms": {
                  "windows-x86_64": {
                      "url": f"{release_url}/{msi_name}",
                      "signature": open(msi_sig, encoding="utf-8").read(),
                      "sha256": msi_sha,
                  },
                  "linux-x86_64": {
                      "url": f"{release_url}/{deb_name}",
                      "signature": open(deb_sig, encoding="utf-8").read(),
                      "sha256": deb_sha,
                  },
              },
          }
          with open("dist/latest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2)
          PY
          minisign -S -s /tmp/minisign.key -m dist/latest.json
          rm -f /tmp/minisign.key
          echo "Update manifest:" && cat dist/latest.json
      - name: Verify the signatures against the key the updater ships
        run: |
          # Verify with the public key compiled into installed copies.
          pubkey=$(sed -n 's/^pub const UPDATE_PUBKEY: &str = "\(.*\)";$/\1/p' \
            crates/occluview-update/src/lib.rs)
          if [[ -z "$pubkey" ]]; then
            echo "Could not read UPDATE_PUBKEY from crates/occluview-update/src/lib.rs." >&2
            exit 1
          fi
          for file in dist/latest.json $(find ./dist -type f -name '*.minisig' -not -name 'latest.json.minisig' | sed 's/\.minisig$//'); do
            minisign -V -P "$pubkey" -m "$file"
            echo "Verified against the shipped public key: $file"
          done
      - name: Bundle verification material
        run: |
          version="${RELEASE_TAG#v}"
          cp ./occluview.pub ./dist/occluview.pub
          (
            cd ./dist
            shopt -s nullglob
            material=( *.sha256 *.minisig latest.json sbom-*.json occluview.pub )
            if [[ "${#material[@]}" -eq 0 ]]; then
              echo "No verification material was produced." >&2
              exit 1
            fi
            zip -q "OccluView-${version}-verification.zip" "${material[@]}"
          )
      - name: Attest build provenance
        if: ${{ !inputs.release_dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # One explicit pattern per artifact: the action splits this list on
          # commas and globs with brace expansion disabled, so a compact
          # dist/*.{msi,zip,deb} matches nothing at all. The SBOM pattern is
          # deliberately narrower than dist/*.json, which would also sweep
          # latest.json, whose provenance is the minisign signature.
          subject-path: |
            dist/*.msi
            dist/*.zip
            dist/*.deb
            dist/sbom-*.json
      - name: Publish GitHub Release
        if: ${{ !inputs.release_dry_run }}
        run: |
          tag="$RELEASE_TAG"
          release_flags=()
          mapfile -d '' assets < <(find ./dist -maxdepth 1 -type f \( -name 'OccluView-Windows-Setup.msi' -o -name 'OccluView-Windows-Portable.zip' -o -name 'OccluView-Linux.deb' -o -name '*-verification.zip' -o -name 'latest.json' -o -name 'latest.json.minisig' \) -print0 | sort -z)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets found." >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "OccluView $tag" --notes-file "./dist/release-notes.md" "${release_flags[@]}"
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "${assets[@]}" --clobber
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${assets[@]}" --title "OccluView $tag" --notes-file "./dist/release-notes.md" "${release_flags[@]}"
          fi

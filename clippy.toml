# clippy configuration.
# Enforced in CI: `cargo clippy --workspace --all-targets --locked -- -D warnings`.

# Cognitive complexity per function.
cognitive-complexity-threshold = 15

# Max function arguments.
too-many-arguments-threshold = 5

# Function length: the pedantic `too_many_lines` default of 100 applies as
# written. There is deliberately no `too-many-lines-threshold` key here --
# lowering it would turn the existing, individually justified exceptions into a
# wave of errors under `-D warnings`. Functions that are legitimately longer
# carry a local `#[allow(clippy::too_many_lines)]`, which keeps each exception
# visible at the function instead of hidden in a global number.
#
# There is no enforced limit on source file length. Split a file when the split
# makes it easier to read, not to reach a number.

# Enum variant size: warn on large variants (helps keep types cache-friendly).
enum-variant-size-threshold = 256

# Prefer MSRV-aware lints. Matches rust-toolchain.toml.
msrv = "1.98"

# Allow certain words in identifiers that clippy's `doc_markdown` flags
# incorrectly for our domain.
doc-valid-idents = [
    "OccluView",
    "OccluTrace",
    "WebGPU",
    "OpenXR",
    "Win32",
    "Direct3D",
    "D3D11",
    "D3D12",
    "WARP",
    "..",
]

# NOTE: lint enablement (e.g. `empty_loop`, `too_many_lines`) lives in
# `[workspace.lints.clippy]` in Cargo.toml, NOT here. This file only holds the
# numeric thresholds that clippy reads from clippy.toml.

# occluview-core — pure data model. NO I/O, NO GPU, NO Win32, NO panics.
# Layering: this crate is the product data model and carries no editing kernel.
# Mesh editing lives in the higher-ranked `occluview-edit` crate.
[package]
name = "occluview-core"
description = "Pure logic for OccluView: math, units, mesh data model, scene graph, camera."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
glam      = { workspace = true }
bytemuck  = { workspace = true }
thiserror = { workspace = true }
rayon     = { workspace = true }
occluview-geometry-math = { workspace = true }

# occluview-edit — mesh-editing façade over the product-neutral
# `occlu-mesh-edit` kernel. It adapts kernel buffers to `occluview-core` meshes
# and owns the world-space bridge split and the scene section assembly, so the
# core data model stays free of the editing kernel.
# Layering: depends on occluview-core (rank 1); the optional `robust-csg`
# feature adds the isolated native CSG fallback.
[package]
name = "occluview-edit"
description = "Mesh-editing façade for OccluView: adapts occlu-mesh-edit to the core mesh model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
robust-csg = ["dep:occluview-robust-csg"]

[lints]
workspace = true

[dependencies]
occluview-core = { workspace = true }
occlu-mesh-edit = { workspace = true }
occluview-robust-csg = { workspace = true, optional = true }
glam = { workspace = true }
thiserror = { workspace = true }

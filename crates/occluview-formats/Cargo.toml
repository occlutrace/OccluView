# occluview-formats — file format readers/writers.
# Layering: depends on occluview-core and occluview-hps.
[package]
name = "occluview-formats"
description = "3D file format readers for OccluView: STL, PLY, OBJ, and GLB."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Private/offline builds may embed an obfuscated HPS key from
# OCCLUVIEW_HPS_EMBEDDED_KEY at compile time. Release packaging may enable this
# only from CI secrets; the key must never be stored in source or logs.
private-hps-key = ["occluview-hps/private-hps-key"]

[dependencies]
occluview-core = { workspace = true }
occluview-hps = { workspace = true }
thiserror      = { workspace = true }
rayon          = { workspace = true }
glam           = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
memmap2        = { workspace = true }
# PNG + JPEG decode for glTF texture images (GLB embeds them in bufferViews).
image          = { workspace = true }

# `GetDriveTypeW`, to refuse memory-mapping a network share or removable drive
# whose disappearance would raise EXCEPTION_IN_PAGE_ERROR instead of an error.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_Storage_FileSystem"]

[dev-dependencies]
zip            = { workspace = true }
proptest = { workspace = true }
tempfile = "3"
# The production reader accepts only PNG/JPEG. Enable BMP in tests solely to
# prove that the byte-level allowlist still refuses a valid, decodable BMP.
image = { workspace = true, features = ["bmp"] }

[[example]]
name = "smoke_real_files"
path = "examples/smoke_real_files.rs"

# NOTE: glTF/GLB is implemented here in pure Rust (see src/gltf/). 3MF is
# deliberately deferred and the code says so at the dispatch point --
# `FormatKind::deferred` in src/dispatch.rs. Each reader ships with tests.

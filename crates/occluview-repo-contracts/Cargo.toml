# occluview-repo-contracts — repository-level contract tests.
#
# The assertions here are about the repository rather than about one crate:
# the CI workflows and the artifact smokes they run, the packaging reports, and
# the version the workspace, the lockfile and the installer must agree on. They
# used to live in `occluview-shell`, which is an opt-in member holding on to
# Windows-only modules that macOS and Linux CI never need to build.
#
# The library target holds only the version parsers: they read text and return
# slices, so this crate has no dependencies at all, and the tests pull in YAML
# and JSON parsing as dev-dependencies.
[package]
name = "occluview-repo-contracts"
description = "Repository-level contract tests: CI workflows, packaging reports, release version."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]

[dev-dependencies]
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }

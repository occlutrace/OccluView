# cargo-deny configuration: license, advisory, and dependency checks.
# Run locally: `cargo deny check`. CI runs the same.

[graph]
all-features = true
# Both shipped platforms. Scanning only Windows left the Linux-only
# dependency trees (x11rb, wayland, the xdg-portal file dialogs) outside
# every license and advisory check.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
unmaintained = "workspace"
# A yank is the fastest signal the ecosystem has that a release is bad. Warning
# about one and building anyway wastes it.
yanked = "deny"
ignore = []

[licenses]
# Allow-list. Anything else is blocked.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    # Mozilla CA-bundle data shipped by webpki-roots (rustls trust anchors for
    # the updater's HTTPS): a permissive data license, not a code license.
    "CDLA-Permissive-2.0",
]
# Keep the license allow-list tight; CI runs cargo-deny on every push.
# Confidence threshold for license detection.
confidence-threshold = 0.93
exceptions = [
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "LicenseRef-UFL-1.0"] },
]

[[licenses.clarify]]
# wgpu / wgpu-hal sometimes need explicit clarification.
name = "wgpu"
version = "*"
expression = "MIT OR Apache-2.0"
license-files = []

[bans]
# One version per crate by default — duplicates must be justified.
multiple-versions = "warn"
# Deny wildcard dependencies (we want reproducible builds).
wildcards = "deny"
# Internal path dependencies carry no version requirement (every crate is
# publish = false), which the wildcard ban would otherwise flag.
allow-wildcard-paths = true
highlight = "all"
# Allow specific known duplicates (none by default — keep this list empty).
allow = []
deny = []
skip = []
skip-tree = []

[sources]
# Only crates.io is allowed by default.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
